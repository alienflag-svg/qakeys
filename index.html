<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4a6fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Georgian layout">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Layout: Georgian / Armenian</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  h1 { font-size: 16px; margin: 0; padding: 0 2px; }
  textarea {
    flex: 1 1 auto;
    width: 100%;
    min-height: 120px;
    font-size: 20px;
    line-height: 1.4;
    padding: 12px;
    border: 1px solid #888;
    border-radius: 8px;
    resize: none;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea.disabled { background: #e9e9e9; color: #555; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
  button, select {
    flex: 1 1 auto;
    min-height: 44px;
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { border: none; background: #4a6fa5; color: white; }
  button:hover { background: #3b5a85; }
  #toggleBtn { background: #2a7a2a; }
  #toggleBtn.off { background: #a53b3b; }
  #toggleBtn:hover { filter: brightness(0.92); }
  select { border: 1px solid #888; background: white; }
  .hint { font-size: 12px; color: #555; padding: 0 2px; }
  .status { font-size: 13px; color: #2a7a2a; min-height: 18px; padding: 0 2px; }
  @media (max-width: 600px) {
    body { padding: 8px; gap: 8px; }
    h1 { font-size: 14px; }
    button, select { font-size: 14px; }
  }
</style>
</head>
<body>

<h1>Screen layout</h1>

<textarea id="input" placeholder="Start typing in Latin..." autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

<div class="buttons">
  <select id="layoutSelect">
    <option value="georgian">Georgian</option>
    <option value="armenian">Armenian</option>
  </select>
  <button id="toggleBtn" type="button">Layout: OFF</button>
  <button id="clearBtn" type="button">Clear</button>
  <button id="copyBtn" type="button">Copy</button>
</div>

<div class="status" id="status"></div>

<div class="hint">
  Type in Latin - letters convert to a choisen layout.
</div>

<script>
// ---------- Таблицы раскладок ----------
const GEORGIAN_LAYOUT = {
  'a': 'ა', 'b': 'ბ', 'g': 'გ', 'd': 'დ', 'e': 'ე',
  'v': 'ვ', 'z': 'ზ', 'T': 'თ', 'i': 'ი', 'k': 'კ',
  'l': 'ლ', 'm': 'მ', 'n': 'ნ', 'o': 'ო', 'p': 'პ',
  'r': 'რ', 's': 'ს', 't': 'ტ', 'u': 'უ', 'f': 'ფ',
  'q': 'ქ', 'R': 'ღ', 'y': 'ყ', 'S': 'შ', 'C': 'ჩ',
  'c': 'ც', 'Z': 'ძ', 'w': 'წ', 'W': 'ჭ', 'x': 'ხ',
  'j': 'ჯ', 'h': 'ჰ',
};

const ARMENIAN_LAYOUT = {
  'a': 'ա', 'b': 'բ', 'c': 'ց', 'd': 'դ', 'e': 'ե',
  'f': 'ֆ', 'g': 'գ', 'h': 'հ', 'i': 'ի', 'j': 'ջ',
  'k': 'կ', 'l': 'լ', 'm': 'մ', 'n': 'ն', 'o': 'ո',
  'p': 'պ', 'q': 'ք', 'r': 'ր', 's': 'ս', 't': 'տ',
  'u': 'ու', 'v': 'վ', 'w': 'ւ', 'x': 'խ', 'y': 'յ',
  'z': 'զ', 'C': 'Չ', 'S': 'Շ', 'T': 'Թ', 'R': 'Ր',
  'P': 'Փ', 'K': 'Ք', 'G': 'Գ', 'D': 'Դ', 'Z': 'Զ',
  'V': 'Վ', 'B': 'Բ', 'M': 'Մ', 'N': 'Ն', 'L': 'Լ',
  'H': 'Հ', 'Y': 'Յ',
  ';': 'թ', "'": 'փ', '[': 'խ', ']': 'ծ',
};

const LAYOUTS = { georgian: GEORGIAN_LAYOUT, armenian: ARMENIAN_LAYOUT };

// ---------- Ключи localStorage ----------
const STORAGE_KEYS = {
  layoutName: 'keyboard.layoutName',
  layoutEnabled: 'keyboard.layoutEnabled',
};

// ---------- DOM ----------
const input = document.getElementById('input');
const statusEl = document.getElementById('status');
const toggleBtn = document.getElementById('toggleBtn');
const clearBtn = document.getElementById('clearBtn');
const copyBtn = document.getElementById('copyBtn');
const layoutSelect = document.getElementById('layoutSelect');

// ---------- Состояние ----------
let layoutEnabled = true;
let currentLayout = GEORGIAN_LAYOUT;

// ---------- Работа с localStorage ----------
function loadState() {
  // layoutName
  try {
    const savedName = localStorage.getItem(STORAGE_KEYS.layoutName);
    if (savedName && LAYOUTS.hasOwnProperty(savedName)) {
      layoutSelect.value = savedName;
    }
  } catch (e) { /* localStorage может быть недоступен */ }

  // layoutEnabled
  try {
    const savedEnabled = localStorage.getItem(STORAGE_KEYS.layoutEnabled);
    if (savedEnabled !== null) {
      layoutEnabled = savedEnabled === 'true';
    }
  } catch (e) { /* ignore */ }
}

function saveLayoutName(name) {
  try { localStorage.setItem(STORAGE_KEYS.layoutName, name); } catch (e) {}
}

function saveLayoutEnabled(enabled) {
  try { localStorage.setItem(STORAGE_KEYS.layoutEnabled, String(enabled)); } catch (e) {}
}

// Применяем загруженное состояние к UI
function applyState() {
  currentLayout = LAYOUTS[layoutSelect.value] || GEORGIAN_LAYOUT;
  updateToggleUI();
}

function updateToggleUI() {
  if (layoutEnabled) {
    toggleBtn.textContent = 'Layout: ON';
    toggleBtn.classList.remove('off');
    input.classList.remove('disabled');
    input.placeholder = 'Start typing in Latin...';
  } else {
    toggleBtn.textContent = 'Layout: OFF';
    toggleBtn.classList.add('off');
    input.classList.add('disabled');
    input.placeholder = 'Layout's off.';
  }
}

// ---------- Перехват ввода ----------
input.addEventListener('keydown', (event) => {
  if (!layoutEnabled) return;
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.isComposing) return;
  if (event.key.length === 1 && currentLayout.hasOwnProperty(event.key)) {
    event.preventDefault();
    insertAtCursor(currentLayout[event.key]);
  }
});

input.addEventListener('beforeinput', (event) => {
  if (!layoutEnabled) return;
  if (event.inputType !== 'insertText') return;
  if (event.isComposing) return;
  const data = event.data;
  if (!data || data.length !== 1) return;
  if (!currentLayout.hasOwnProperty(data)) return;
  event.preventDefault();
  insertAtCursor(currentLayout[data]);
});

function insertAtCursor(text) {
  const start = input.selectionStart;
  const end = input.selectionEnd;
  const value = input.value;
  input.value = value.slice(0, start) + text + value.slice(end);
  const newPos = start + text.length;
  input.setSelectionRange(newPos, newPos);
  if (document.activeElement !== input) input.focus();
}

// ---------- Управление ----------
layoutSelect.addEventListener('change', () => {
  currentLayout = LAYOUTS[layoutSelect.value] || GEORGIAN_LAYOUT;
  saveLayoutName(layoutSelect.value);
  const label = layoutSelect.value === 'armenian' ? 'Armenian' : 'Georgian';
  setStatus(`layout is switched to ${label}.`);
  input.focus();
});

toggleBtn.addEventListener('click', () => {
  layoutEnabled = !layoutEnabled;
  saveLayoutEnabled(layoutEnabled);
  updateToggleUI();
  setStatus(layoutEnabled ? 'layout ON.' : 'layout OFF.');
  input.focus();
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  input.focus();
  setStatus('Area cleared.');
});

copyBtn.addEventListener('click', async () => {
  if (!input.value) {
    setStatus('Empty area — nothing to copy.');
    return;
  }
  try {
    await navigator.clipboard.writeText(input.value);
    setStatus('Text copied to clipboard.');
  } catch (err) {
    input.select();
    try {
      document.execCommand('copy');
      setStatus('Text copied (fallback).');
    } catch (e) {
      setStatus('Copy failed: ' + err.message);
    }
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
});

// ---------- Статус ----------
let statusTimer = null;
function setStatus(msg) {
  statusEl.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2500);
}

// ---------- Инициализация ----------
loadState();
applyState();
input.focus();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('SW registered'))
      .catch((err) => console.log('SW error:', err));
  });
}

</script>

</body>
</html>
